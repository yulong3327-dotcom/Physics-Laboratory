name: Course Platform CI

on:
  push:
    paths:
      - 'course-platform/**'
      - '.github/workflows/course-platform-ci.yml'
  pull_request:
    paths:
      - 'course-platform/**'
      - '.github/workflows/course-platform-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: course-platform
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: course-platform/package-lock.json
      - run: npm ci --include=dev
      - run: npm test
      - run: npm run build
